<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Clinic Network - Hub Structure</title>
    <link rel="stylesheet" href="index.css">
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/antv-g6/4.8.24/g6.min.js"></script> -->
     <script type="module" src="./index.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Header -->
            <div class="header">
                <h1>VA Dental Clinic Network</h1>
                <p>General Dentists (Hubs) connected to nearby Specialists</p>
            </div>
            
            <!-- Search Panel -->
            <div class="search-panel">
                <div class="search-title">
                    🔍 Search & Filter Clinics
                </div>
                
                <div class="search-grid">
                    <div class="search-field">
                        <label class="search-label">City</label>
                        <div class="multi-select">
                            <div class="search-input multi-select-trigger" id="cityTrigger">
                                <span id="cityDisplayText">All Cities</span>
                                <span>▼</span>
                            </div>
                            <div class="multi-select-dropdown" id="cityDropdown">
                                <!-- Cities will be populated by JavaScript -->
                            </div>
                        </div>
                        <div class="selected-cities" id="selectedCities"></div>
                    </div>
                    
                    <div class="search-field">
                        <label class="search-label">Doctor/Clinic Name</label>
                        <input type="text" class="search-input" id="nameSearch" placeholder="Search by doctor or clinic name...">
                    </div>
                    
                    <div class="search-field">
                        <label class="search-label">Specialty</label>
                        <select class="search-select" id="specialtyFilter">
                            <option value="">All Specialties</option>
                            <!-- Specialties will be populated by JavaScript -->
                        </select>
                    </div>
                </div>
                
                <div class="search-actions">
                    <button class="btn btn-primary" id="searchBtn">
                        🔍 Search
                    </button>
                    <button class="btn btn-success" id="findConnectionBtn">
                        🔗 Find Connections
                    </button>
                    <button class="btn btn-secondary" id="clearBtn">
                        ✕ Clear
                    </button>
                </div>
                
                <div id="searchResults" class="search-results" style="display: none;"></div>
            </div>
            
            <!-- Legend -->
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color hub" style="background: #FF6B6B;"></div>
                    <span>General Dentist (Hub)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ECDC4;"></div>
                    <span>Orthodontist</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #45B7D1;"></div>
                    <span>Pediatric Dentist</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #96CEB4;"></div>
                    <span>Endodontist</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #FECA57;"></div>
                    <span>Oral Surgeon</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF9FF3;"></div>
                    <span>Periodontist</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #A8E6CF;"></div>
                    <span>Other Specialist</span>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="main-content">
                <!-- Graph Container -->
                <div class="graph-section">
                    <div id="graph-container"></div>
                </div>
                
                <!-- Desktop Details Panel -->
                <div class="details-section">
                    <div id="details-panel" class="details-panel">
                        <div class="placeholder">
                            <div class="placeholder-icon">🦷</div>
                            <p><strong>Click or hover on a node</strong></p>
                            <p>to view clinic details</p>
                        </div>
                    </div>
                </div>
            </div>
 
        </div>
    </div>

</body>
</html>
